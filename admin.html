<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Espace admin — Ndosho Comédie Club</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="icon" href="./logo/ndoshologo.png">
</head>

<body>

    <!-- ══ CONNEXION ═══════════════════════════════════════ -->
    <main class="login-view" id="loginView">
        <form class="login-card" id="loginForm" autocomplete="on">
            <img src="./logo/ndoshologo-3.png" alt="Ndosho Comédie Club" class="login-logo" />
            <h1>Espace admin</h1>
            <p class="login-sub">Accès réservé à l'équipe du Ndosho Comédie Club.</p>
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" autocomplete="username" required />
            <label for="loginPass">Mot de passe</label>
            <input type="password" id="loginPass" autocomplete="current-password" required />
            <p class="login-error" id="loginError" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary" id="loginBtn">Se connecter</button>
            <a href="index.html" class="login-back">← Retour au site</a>
        </form>
    </main>

    <!-- ══ APPLICATION ═════════════════════════════════════ -->
    <div class="app-view" id="appView" hidden>
        <header class="app-header">
            <div>
                <strong>Espace admin</strong>
                <span class="app-user" id="appUser"></span>
            </div>
            <div class="app-header-actions">
                <a href="index.html" class="btn btn-ghost">Voir le site</a>
                <button type="button" class="btn btn-ghost" id="logoutBtn">Déconnexion</button>
            </div>
        </header>

        <nav class="tabs" role="tablist">
            <button type="button" class="tab active" data-tab="messages" role="tab">Messages <span class="badge" id="badgeMessages" hidden>0</span></button>
            <button type="button" class="tab" data-tab="temoignages" role="tab">Témoignages <span class="badge" id="badgeTemoignages" hidden>0</span></button>
            <button type="button" class="tab" data-tab="actualites" role="tab">Actualités</button>
        </nav>

        <p class="banner" id="appBanner" role="alert" hidden></p>

        <!-- Messages -->
        <section class="panel" id="panel-messages">
            <h2>Messages reçus</h2>
            <div class="list" id="listMessages"></div>
        </section>

        <!-- Témoignages -->
        <section class="panel" id="panel-temoignages" hidden>
            <h2>Témoignages</h2>
            <div class="chips" id="chipsTemoignages">
                <button type="button" class="chip active" data-statut="en_attente">En attente</button>
                <button type="button" class="chip" data-statut="approuve">Approuvés</button>
                <button type="button" class="chip" data-statut="refuse">Refusés</button>
            </div>
            <div class="list" id="listTemoignages"></div>
        </section>

        <!-- Actualités -->
        <section class="panel" id="panel-actualites" hidden>
            <h2>Publier une actualité</h2>
            <form class="card form" id="actuForm">
                <label for="actuType">Type</label>
                <select id="actuType">
                    <option value="actualite">Actualité</option>
                    <option value="annonce">Annonce</option>
                    <option value="communique">Communiqué</option>
                    <option value="message">Message</option>
                    <option value="evenement">Événement</option>
                    <option value="autre">Autre</option>
                </select>
                <label for="actuTitre">Titre</label>
                <input type="text" id="actuTitre" maxlength="140" required />
                <label for="actuContenu">Contenu</label>
                <textarea id="actuContenu" rows="7" maxlength="8000" required></textarea>
                <label for="actuImage">Image de la publication (facultatif : affichée sur la carte et en grand)</label>
                <input type="file" id="actuImage" accept="image/*" />
                <div class="img-preview" id="actuImagePreviewBox" hidden>
                    <img id="actuImagePreview" alt="Aperçu" />
                    <button type="button" class="btn btn-ghost btn-sm" id="actuImageRemove">Retirer l'image</button>
                </div>
                <label class="check"><input type="checkbox" id="actuEpingle" /> Épingler en haut (à la une)</label>
                <label class="check"><input type="checkbox" id="actuPublie" checked /> Publier tout de suite (sinon : brouillon)</label>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="actuSubmit">Publier</button>
                    <button type="button" class="btn btn-ghost" id="actuCancel" hidden>Annuler la modification</button>
                </div>
            </form>

            <h2 class="mt">Vos publications <span class="total-views" id="totalViews"></span></h2>
            <div class="list" id="listActus"></div>
        </section>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>

</html>
