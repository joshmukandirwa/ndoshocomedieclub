<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="author" content="Josué Mukandirwa — EbenJosh Tech &amp; Services" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        // Force TOUJOURS l'affichage "version ordinateur" (2 colonnes),
        // que l'utilisateur ait coché ou non "Version ordinateur" dans Chrome.
        (function () {
            var vp = document.querySelector('meta[name="viewport"]');
            if (vp) {
                vp.setAttribute('content', 'width=1200');
            }
        })();
    </script>
    <title>Mon billet — Ndosho Comédie Club</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800&family=Permanent+Marker&display=swap" />
    <link rel="stylesheet" href="css/reservation.css" />
    <link rel="stylesheet" href="css/billet.css" />
    <link rel="icon" href="./logo/ndoshologo.png">
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .bp-wrap {
            margin: 0 auto;
        }

        #billetOk {
            width: 100%;
            max-width: 880px;
            min-width: 0;
        }

        #billetOk p {
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .billet-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 12px;
            gap: 24px;
            width: 100%;
        }

        .billet-page h1 {
            color: var(--navy);
            font-size: 1.5rem;
            text-align: center;
        }

        .billet-page>p {
            color: var(--gray);
            max-width: 400px;
            font-size: 0.9rem;
            margin-top: -12px;
            text-align: center;
        }

        .billet-error {
            display: none;
            max-width: 420px;
            background: #fff;
            border: 2px solid var(--orange);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
        }

        .billet-error.show {
            display: block;
        }

        .billet-error h2 {
            color: var(--orange);
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .billet-error p {
            color: var(--black);
            font-size: 0.9rem;
        }

        .billet-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .billet-logo img {
            height: 42px;
        }

        .billet-logo span {
            font-weight: 800;
            color: var(--navy);
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <main class="billet-page">
        <a href="index.html" class="billet-logo">
            <img src="./logo/ndoshologo.png" alt="Logo Ndosho Comédie Club" />
            <span>NDOSHO COMÉDIE CLUB</span>
        </a>

        <div id="billetOk">
            <h1>Votre billet numérique</h1>
            <p style="text-align: center;">Présentez ce billet (à l'écran ou imprimé) à l'entrée de l'événement.</p>
            <br>
            <div class="bp-wrap show" id="ticketCard"></div>

            <div class="ticket-actions" style="justify-content:center; margin-top: 20px;">
                <button class="btn-download" id="downloadBtn">Télécharger (PNG)</button>
            </div>
        </div>

        <div class="billet-error" id="billetError">
            <h2>Lien de billet invalide</h2>
            <p>Ce lien est incomplet ou corrompu. Contactez le Ndosho Comédie Club sur WhatsApp avec votre nom et
                l'événement pour qu'on vous renvoie votre billet.</p>
        </div>
    </main>

    <script src="js/billet-ui.js"></script>
    <script src="js/mon-billet.js"></script>
</body>

</html>
